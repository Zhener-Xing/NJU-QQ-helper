services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: nju-qq-helper-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 与容器内监听端口一致（Dockerfile EXPOSE 8000）
      PORT: "8000"
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./data:/app/data

  bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    container_name: nju-qq-helper-bridge
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
