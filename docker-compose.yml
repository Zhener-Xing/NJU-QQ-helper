services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: nju-qq-helper-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8000"
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./data:/app/data

  bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    container_name: nju-qq-helper-bridge
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - napcat  # 确保napcat先启动

  # 新增：把NapCat服务直接加入这个compose
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    ports:
      - "3002:3002"
    volumes:
      - /root/napcat/config:/app/.config/QQ
