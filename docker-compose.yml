version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: nju-qq-helper-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8000"
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./data:/app/data

  bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    container_name: nju-qq-helper-bridge
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - napcat

  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    network_mode: host
    volumes:
      - /root/napcat/config:/app/.config/QQ
